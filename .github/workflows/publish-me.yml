name: Publish .me

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'ops/**'
      - 'static/**'
      - 'storage/**/en.md'
      - '.github/workflows/publish-me.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # 3.9.1
        with:
          node-version: '20'

      - run: npm ci
      - run: npm run build

      - name: Deploy
        uses: SamKirkland/FTP-Deploy-Action@a51268f67f6605236975928ae28b0f7e9971d50a # v4.3.6
        with:
          server: ${{ secrets.DEPLOY_HOST_ME }}
          username: ${{ secrets.DEPLOY_USER_ME }}
          password: ${{ secrets.DEPLOY_PASSWORD_ME }}
          local-dir: ${{ secrets.SOURCE_ME }}
          log-level: verbose
